<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mitarbeiter Dashboard</title>
    <meta name="description" content="Das zentrale Dashboard für Mitarbeiter – Aufträge, Bewertungen und mehr auf einen Blick." />
    <link rel="icon" id="app-favicon" href="/favicon.png" type="image/png" />
    <script>
      (function(){
        try {
          var link = document.getElementById('app-favicon');
          var DEFAULT_ICON = "/favicon.png";
          // Guard: if any branding favicon fails to load (e.g. file gone), fall back to default icon.
          var check = function(){
            var url = link.getAttribute('href');
            if (!url || url === DEFAULT_ICON) return;
            var img = new Image();
            img.onerror = function(){ if (link.getAttribute('href') === url) link.setAttribute('href', DEFAULT_ICON); };
            img.src = url;
          };
          new MutationObserver(check).observe(link, { attributes: true, attributeFilter: ['href'] });

          var h = window.location.hostname.toLowerCase().replace(/^www\./, "");
          if (!h || h === 'localhost') return;
          var SB_URL = "%VITE_SUPABASE_URL%";
          var SB_KEY = "%VITE_SUPABASE_PUBLISHABLE_KEY%";
          var parts = h.split(".");
          var root = parts.length > 2 ? parts.slice(-2).join(".") : h;
          var hosts = [h]; if (root !== h) hosts.push(root);
          var list = hosts.map(function(x){ return '"' + x + '"'; }).join(",");
          var q = "or=(domain.in.(" + list + "),additional_domains.ov.{" + list + "})";
          fetch(SB_URL + "/rest/v1/brandings?select=domain,favicon_url&" + encodeURI(q), {
            headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY }
          }).then(function(r){ return r.json(); }).then(function(d){
            if (!Array.isArray(d) || !d.length) return;
            var best = d.find(function(b){ return b.domain === h; }) || d.find(function(b){ return b.domain === root; }) || d[0];
            if (best && best.favicon_url) link.setAttribute('href', best.favicon_url);
          }).catch(function(){});
        } catch(e){}
      })();
    </script>

    <meta property="og:title" content="Mitarbeiter Dashboard" />
    <meta property="og:description" content="Das zentrale Dashboard für Mitarbeiter – Aufträge, Bewertungen und mehr auf einen Blick." />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
